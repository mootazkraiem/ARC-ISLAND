name: Build unsigned iOS .ipa (for SideStore)

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Select a recent Xcode (React Native 0.86 needs >= 16.1)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Generate the native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Find the generated workspace + scheme
        id: xcode
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Found workspace: $WORKSPACE, scheme: $SCHEME"

      - name: Build for a real device, unsigned
        working-directory: ios
        run: |
          xcodebuild build \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package the .app into an unsigned .ipa
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y ArcIsland-unsigned.ipa Payload
          mkdir -p ../ipa-output
          mv ArcIsland-unsigned.ipa ../ipa-output/

      - name: Upload the .ipa as a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcIsland-unsigned-ipa
          path: ipa-output/ArcIsland-unsigned.ipa
          retention-days: 30
